<!-- templates/index.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Terminal Manager</title>
    <script src="https://cdn.socket.io/4.5.0/socket.io.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
<style>
    /* General body styling */
    body {
        font-family: Arial, sans-serif;
        margin: 10px;
        padding: 0;
        background-color: #f5f5f5;
        -webkit-user-select: none; /* Disable text selection for mobile touch */
        -ms-user-select: none;
        user-select: none;
    }

    /* Container with responsive padding */
    .container {
        max-width: 100%;
        margin: 0 auto;
        padding: 10px;
    }

    /* Header styling with touch-friendly spacing */
    .header {
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        align-items: flex-start;
        margin-bottom: 15px;
        padding: 15px;
        background-color: #fff;
        border-radius: 8px;
        box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }

    /* Status indicators */
    .status-indicator {
        display: inline-block;
        width: 16px;
        height: 16px;
        border-radius: 50%;
        margin-right: 8px;
    }
    .connected {
        background-color: #4CAF50;
    }
    .disconnected {
        background-color: #F44336;
    }

    /* Master controls: wrap on small screens */
    .master-controls {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-top: 10px;
        width: 100%;
    }

    /* Buttons: larger for touch */
    button {
        padding: 12px 20px;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        font-weight: bold;
        font-size: 1em;
        min-width: 100px;
        flex: 1;
        text-align: center;
    }
    .start-btn {
        background-color: #4CAF50;
        color: white;
    }
    .stop-btn {
        background-color: #F44336;
        color: white;
    }
    .master-start {
        background-color: #2196F3;
        color: white;
    }
    .master-stop {
        background-color: #FF9800;
        color: white;
    }

    /* Terminal grid: single column on small screens */
    .terminals-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
        gap: 15px;
    }

    /* Terminal styling */
    .terminal {
        background-color: #000;
        color: #0F0;
        font-family: 'Courier New', monospace;
        padding: 12px;
        border-radius: 8px;
        height: 220px;
        overflow-y: auto;
        white-space: pre-wrap;
        word-wrap: break-word;
        font-size: 0.9em;
    }

    /* Terminal controls */
    .terminal-controls {
        display: flex;
        justify-content: space-between;
        margin-bottom: 8px;
        flex-wrap: wrap;
        gap: 5px;
    }
    .terminal-title {
        font-weight: bold;
        margin-bottom: 5px;
        color: #333;
        font-size: 1em;
    }
    .terminal-status {
        font-size: 0.9em;
        color: #666;
    }
    .running {
        color: #4CAF50;
    }
    .stopped {
        color: #F44336;
    }

    /* Responsive adjustments for small screens */
    @media (max-width: 480px) {
        .header {
            align-items: flex-start;
        }
        button {
            font-size: 0.9em;
            padding: 10px;
        }
        .terminal {
            height: 180px;
            font-size: 0.85em;
        }
    }
</style>

</head>
<body>
    <div class="container">
        <div class="header">
            <div>
                <h1>Monitor Jetson_Process</h1>
                <div id="connection-status">
                    <span class="status-indicator disconnected" id="status-indicator"></span>
                    <span id="status-text">Disconnected from server</span>
                </div>
            </div>
            <div class="master-controls">
                <button class="master-start" onclick="startAll()">Master Start</button>
                <button class="master-stop" onclick="stopAll()">Master Stop</button>
            </div>
        </div>

        <div class="terminals-grid">
            {% for id, term in terminals.items() %}
            <div class="terminal-card">
                <div class="terminal-title">Terminal {{ id }}: {{ term.name }}</div>
                <div class="terminal-controls">
                    <button class="start-btn" onclick="startTerminal({{ id }})">Start</button>
                    <button class="stop-btn" onclick="stopTerminal({{ id }})">Stop</button>
                    <span class="terminal-status" id="status-{{ id }}">Stopped</span>
                </div>
                <div class="terminal" id="terminal-{{ id }}"></div>
            </div>
            {% endfor %}
        </div>
    </div>

   <script>
// ======================
// SOCKET.IO CONNECTION
// ======================

// Connect to the SocketIO server (the backend running on Flask-SocketIO)
const socket = io();
let connected = false;  // Track whether we are connected to server

// When client successfully connects to server
socket.on('connect', function() {
    connected = true;
    updateConnectionStatus(true); // Update UI status indicator
    console.log('Connected to server');
    
    // Load initial outputs & statuses for all terminals (so user sees something immediately)
    for (let i = 1; i <= 6; i++) {
        loadTerminalOutput(i);    // <-- fallback: fetch last 5 lines
        checkTerminalStatus(i);   // <-- check if terminal is running/stopped
    }
});

// When disconnected from server
socket.on('disconnect', function() {
    connected = false;
    updateConnectionStatus(false); // Update UI to show disconnection
    console.log('Disconnected from server');
});

// When server sends a "connection_status" event
socket.on('connection_status', function(data) {
    connected = data.status === 'connected';
    updateConnectionStatus(connected);
});

// ======================
// REAL-TIME TERMINAL OUTPUT (SocketIO push)
// ======================

// Live updates pushed from backend whenever new output is available
socket.on('terminal_output', function(data) {
    const terminal = document.getElementById(`terminal-${data.id}`);
    if (terminal) {
        // Append new line of output
        terminal.textContent += data.output;

        // Keep only last 100 lines (to prevent memory bloat)
        const lines = terminal.textContent.split('\n');
        if (lines.length > 100) {
            terminal.textContent = lines.slice(-100).join('\n');
        }

        // Auto-scroll to bottom (like a real terminal tail)
        terminal.scrollTop = terminal.scrollHeight;
    }
});

// ======================
// POLLING FALLBACK (loadTerminalOutput)
// ======================

// This is only used for initial load or if SocketIO fails
function loadTerminalOutput(id) {
    axios.get(`/terminal_output/${id}`)
        .then(response => {
            const terminal = document.getElementById(`terminal-${id}`);
            if (terminal) {
                terminal.textContent = response.data.output;
                terminal.scrollTop = terminal.scrollHeight;
            }
        })
        .catch(error => {
            console.error('Error loading terminal output:', error);
        });
}

// ======================
// UI STATUS INDICATOR
// ======================

function updateConnectionStatus(isConnected) {
    const indicator = document.getElementById('status-indicator');
    const statusText = document.getElementById('status-text');
    
    if (isConnected) {
        indicator.className = 'status-indicator connected';
        statusText.textContent = 'Connected to server';
    } else {
        indicator.className = 'status-indicator disconnected';
        statusText.textContent = 'Disconnected from server';
    }
}

// ======================
// TERMINAL CONTROLS
// ======================

// Start a specific terminal
function startTerminal(id) {
    if (!connected) {
        alert('Not connected to server');
        return;
    }
    
    axios.post(`/start_terminal/${id}`)
        .then(response => {
            console.log(`Terminal ${id} started:`, response.data);
            checkTerminalStatus(id);
        })
        .catch(error => {
            console.error('Error:', error);
            alert('Failed to start terminal');
        });
}

// Stop a specific terminal
function stopTerminal(id) {
    if (!connected) {
        alert('Not connected to server');
        return;
    }
    
    axios.post(`/stop_terminal/${id}`)
        .then(response => {
            console.log(`Terminal ${id} stopped:`, response.data);
            checkTerminalStatus(id);
        })
        .catch(error => {
            console.error('Error:', error);
            alert('Failed to stop terminal');
        });
}

// Start all terminals
function startAll() {
    if (!connected) {
        alert('Not connected to server');
        return;
    }
    
    axios.post('/start_all')
        .then(response => {
            console.log('All terminals started:', response.data);
            for (let i = 1; i <= 6; i++) {
                checkTerminalStatus(i);
            }
        })
        .catch(error => {
            console.error('Error:', error);
            alert('Failed to start all terminals');
        });
}

// Stop all terminals
function stopAll() {
    if (!connected) {
        alert('Not connected to server');
        return;
    }
    
    axios.post('/stop_all')
        .then(response => {
            console.log('All terminals stopped:', response.data);
            for (let i = 1; i <= 6; i++) {
                checkTerminalStatus(i);
            }
        })
        .catch(error => {
            console.error('Error:', error);
            alert('Failed to stop all terminals');
        });
}

// ======================
// TERMINAL STATUS CHECK
// ======================

function checkTerminalStatus(id) {
    axios.get(`/terminal_status/${id}`)
        .then(response => {
            const statusElement = document.getElementById(`status-${id}`);
            if (statusElement) {
                if (response.data.running) {
                    statusElement.textContent = 'Running';
                    statusElement.className = 'terminal-status running';
                } else {
                    statusElement.textContent = 'Stopped';
                    statusElement.className = 'terminal-status stopped';
                }
            }
        })
        .catch(error => {
            console.error('Error checking terminal status:', error);
        });
}

// ======================
// PERIODIC HEALTH CHECK
// ======================

// Ping the server every 3s to see if it’s alive
setInterval(() => {
    axios.get('/health')
        .then(response => {
            if (response.data.status === 'ok' && !connected) {
                // Try to reconnect SocketIO if lost
                socket.connect();
            }
        })
        .catch(error => {
            console.log('Server connection lost');
            updateConnectionStatus(false);
        });
}, 3000);

// Periodically refresh terminal status (every 5s)
setInterval(() => {
    if (connected) {
        for (let i = 1; i <= 6; i++) {
            checkTerminalStatus(i);
        }
    }
}, 5000);

</script>

</body>
</html>
